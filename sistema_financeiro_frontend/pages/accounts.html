<section class="accounts">

    <!-- Título da página -->
    <div class="main-top-section">
        <h1 class="title-section">Contas</h1>
    </div>

    <!-- Barra de filtros -->
    <div class="accounts-toolbar toolbar">

        <!-- Pesquisa -->
        <div class="accounts-search search-bar">
            <i class="bi bi-search"></i>
            <input type="search" placeholder="Pesquisar" aria-label="Pesquisar contas">
        </div>

        <!-- Filtro de data -->
        <div class="dropdown accounts-date-filter filter">
            <!-- Dropdown de data -->
            <button type="button" class="date-filter-btn filter-btn" data-bs-toggle="dropdown"
                data-bs-auto-close="outside" aria-expanded="false">
                <span class="selected-account-date">Data</span>
                <i class="bi bi-chevron-down filter-arrow"></i>
            </button>

            <div class="dropdown-menu date-filter-menu filter-menu-section">

                <h6 class="filter-menu-title">Selecionar data</h6>

                <hr class="dropdown-divider">

                <!-- Campo de data -->
                <input type="date" id="account-date-filter" class="form-control date-filter-input"
                    aria-label="Filtrar contas por data">

                <!-- Botão para limpar filtro -->
                <button type="button" class="clear-filter-btn">Limpar</button>

            </div>
        </div>

        <!-- Filtro de tipo -->
        <div class="dropdown accounts-filter filter account-type-filter">
            <!-- Dropdown de tipo -->
            <button type="button" class="type-filter-btn filter-btn" data-bs-toggle="dropdown"
                data-bs-auto-close="outside" aria-expanded="false">
                <span class="selected-account-type">Tipo</span>
                <i class="bi bi-chevron-down filter-arrow"></i>
            </button>

            <div class="dropdown-menu type-filter-menu filter-menu-section">

                <h6 class="filter-menu-title">Selecione o tipo</h6>

                <hr class="dropdown-divider">

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="all-types" checked>

                    <label class="form-check-label" for="all-types">
                        Todos os tipos
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checking-type">

                    <label class="form-check-label" for="checking-type">
                        Conta bancária
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="savings-type">

                    <label class="form-check-label" for="savings-type">
                        Poupança
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="wallet-type">

                    <label class="form-check-label" for="wallet-type">
                        Carteira
                    </label>
                </div>

            </div>

        </div>

        <!-- Filtro de status -->
        <div class="dropdown accounts-filter filter account-status-filter">
            <!-- Dropdown de status -->
            <button type="button" class="status-filter-btn filter-btn" data-bs-toggle="dropdown"
                data-bs-auto-close="outside" aria-expanded="false">
                <span class="selected-account-status">Status</span>
                <i class="bi bi-chevron-down filter-arrow"></i>
            </button>

            <div class="dropdown-menu type-filter-menu filter-menu-section">

                <h6 class="filter-menu-title">Selecione um status</h6>

                <hr class="dropdown-divider">

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="all-status" checked>

                    <label class="form-check-label" for="all-status">
                        Todos os status
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="activate-status">

                    <label class="form-check-label" for="activate-status">
                        Ativo
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="inactivate-status">

                    <label class="form-check-label" for="inactivate-status">
                        Inativo
                    </label>
                </div>
            </div>

        </div>

        <!-- Adicionar conta -->
        <button type="button" class="add-account-btn add-btn" data-bs-toggle="modal" data-bs-target="#accountModal">
            <span>+ Adicionar conta</span>
        </button>

    </div>

    <!-- Tabela de contas -->
    <div class="accounts-table-section table-section">

        <div class="table-responsive">
            <table class="table data-table accounts-table">

                <thead>
                    <tr class="table-header">
                        <th scope="col">Data</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Status</th>
                        <th scope="col">Saldo atual</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr class="table-row" data-name="Conta do banco" data-date="2026-10-13" data-type="Conta bancária"
                        data-status="Ativo">

                        <td>13/10/2026</td>
                        <td>Conta do banco</td>
                        <td>Conta bancária</td>
                        <td>Ativo</td>
                        <td>R$ 950,00</td>
                        <td>
                            <button type="button" class="edit-btn">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button type="button" class="delete-btn">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </td>
                    </tr>

                    <tr class="table-row" data-name="Conta de teste" data-date="2026-10-13" data-type="Carteira"
                        data-status="Inativo">

                        <td>13/10/2026</td>
                        <td>Conta de teste</td>
                        <td>Carteira</td>
                        <td>Inativo</td>
                        <td>R$ 0,00</td>
                        <td>
                            <button type="button" class="edit-btn" aria-label="Editar Conta do banco">
                                <i class="bi bi-pencil" aria-hidden="true"></i>
                            </button>

                            <button type="button" class="delete-btn" aria-label="Excluir Conta do banco">
                                <i class="bi bi-trash3" aria-hidden="true"></i>
                            </button>

                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

        <!-- Aparecer no meio da tabela quando não ter nenhum elemento nela. -->
        <div class="empty-state accounts-empty-state d-none">
            <i class="bi bi-inbox"></i>
            <p class="accounts-empty-message">Não há contas cadastradas</p>
        </div>

    </div>


</section>

<!-- Modal de cadastro de contas -->
<div class="modal fade" id="accountModal" tabindex="-1" aria-labelledby="accountModalTitle" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content account-modal system-modal">

            <!-- Cabeçalho -->
            <div class="modal-header">

                <h2 class="modal-title" id="accountModalTitle">
                    <i class="bi bi-bank"></i>
                    Adicionar uma conta
                </h2>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar">
                </button>

            </div>

            <!-- Formulário -->
            <form id="accountForm" class="system-form">

                <div class="modal-body">

                    <div class="account-form-field system-form-field">
                        <label for="accountName">Nome</label>
                        <input type="text" id="accountName" name="name" class="form-control" required>
                    </div>

                    <div class="account-form-field system-form-field">
                        <label for="accountType">Tipo</label>
                        <select id="accountType" name="type" class="form-select" required>

                            <option value="" selected disabled>
                                Selecione um tipo
                            </option>
                            <option value="Conta bancária">
                                Conta bancária
                            </option>
                            <option value="Poupança">
                                Poupança
                            </option>
                            <option value="Carteira">
                                Carteira
                            </option>

                        </select>
                    </div>

                    <div class="account-form-field system-form-field">
                        <label for="accountStatus">Status</label>
                        <select id="accountStatus" name="status" class="form-select" required>

                            <option value="Ativo" selected>Ativo</option>
                            <option value="Inativo">Inativo</option>

                        </select>
                    </div>

                    <div class="account-form-field system-form-field">
                        <label for="accountBalance">
                            Saldo inicial
                        </label>
                        <input type="number" id="accountBalance" name="balance" class="form-control" min="0" step="0.01"
                            placeholder="R$ 0,00" required>
                    </div>

                </div>

                <!-- Rodapé -->
                <div class="modal-footer">

                    <button type="button" class="cancel-btn" data-bs-dismiss="modal">
                        <span class="cancel-btn-label">Cancelar</span>
                    </button>

                    <button type="submit" class="save-btn">
                        + Adicionar
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
