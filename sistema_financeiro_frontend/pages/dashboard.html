<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
    <section class="dashboard">

        <!-- Todas as páginas terão basicamente essa seção para o título -->
        <div class="dashboard-top-section">
            <h1 class="title-section">Dashboard</h1>

            <!-- Filtros -->
            <div class="filter-section">

                <div class="filter-wrapper">

                    <button class="filter-trigger" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                        aria-expanded="false">
                        <i class="bi bi-bank"></i>
                        <span>Contas</span>
                        <i class="bi bi-chevron-down filter-arrow"></i>
                    </button>

                    <div class="dropdown-menu filter-menu">
                        <!-- Lista de contas -->
                        <h6 class="filter-menu-title">Contas</h6>

                        <hr class="dropdown-divider">

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="all-accounts" checked>

                            <label class="form-check-label" for="all-accounts">
                                Todas as contas
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="bank-account">

                            <label class="form-check-label" for="bank-account">
                                Conta do banco
                            </label>
                        </div>
                    </div>

                </div>

                <div class="filter-wrapper">

                    <button type="button" class="filter-trigger" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                        aria-expanded="false">
                        <i class="bi bi-calendar-date"></i>
                        <span>Período</span>
                        <i class="bi bi-chevron-down filter-arrow"></i>
                    </button>

                    <div class="dropdown-menu dropdown-menu-end filter-menu .period-menu">
                        <!-- Datas -->
                        <h6 class="filter-menu-title">Período</h6>

                        <hr class="dropdown-divider">

                        <div class="period-fields">

                            <div class="period-field">
                                <label for="start-date">Data inicial</label>
                                <input type="date" id="start-date" class="form-control">
                            </div>

                            <div class="period-field">
                                <label for="end-date">Data final</label>
                                <input type="date" id="end-date" class="form-control">
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Cards financeiros -->

        <!-- Painéis -->

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
