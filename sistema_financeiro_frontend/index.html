<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Financeiro</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/dropdown.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/filters.css">
    <link rel="stylesheet" href="css/tables.css">
</head>

<body>

    <section class="app-layout">

        <!-- Menu Lateral  -->
        <aside class="sidebar">

            <div class="sidebar-top">
                <!-- Logo -->
                <div class="logo">
                    <h3>Logo</h3>
                </div>
            </div>

            <nav class="sidebar-navigation">
                <!-- Link das páginas -->
                <p class="text-section">Principal</p>

                <a href="#" class="page-btn active" data-page="dashboard">
                    <i class="bi bi-grid-1x2"></i>
                    <span>Dashboard</span>
                </a>

                <a href="#" class="page-btn" data-page="accounts">
                    <i class="bi bi-bank"></i>
                    <span>Contas</span>
                </a>

                <a href="#" class="page-btn" data-page="transactions">
                    <i class="bi bi-arrow-left-right"></i>
                    <span>Transações</span>
                </a>

                <a href="#" class="page-btn" data-page="categories">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>Categorias</span>
                </a>

                <a href="#" class="page-btn" data-page="goals">
                    <i class="bi bi-piggy-bank"></i>
                    <span>Metas</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <!-- Perfil e sair -->

                <p class="text-section">
                    Conta
                </p>

                <div class="account-section">

                    <div class="account-info">
                        <div class="account-profile">
                            <i class="bi bi-person"></i>
                        </div>

                        <p class="profile-name">
                            Conta do Usuário
                        </p>
                    </div>

                    <button type="button" class="config-btn" aria-label="Configurações">
                        <i class="bi bi-gear"></i>
                    </button>
                </div>

                <div class="exit-section">
                    <button type="button" class="exit-btn">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Sair</span>
                    </button>
                </div>

            </div>

        </aside>

        <!-- Conteúdo à direita -->

        <div class="app-content">

            <header class="app-header">
                <!-- Título, notificações e perfil -->
                <p class="system-title">Sistema de Gestão Financeira Pessoal</p>

                <div class="user-section">
                    <button type="button" class="notify-btn" aria-label="Notificações">
                        <i class="bi bi-bell" aria-hidden="true"></i>
                    </button>

                    <!-- Dropdown -->
                    <div class="dropdown">

                        <!-- Botão do Dropdown  -->
                        <button type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                            aria-expanded="false" class="account-btn" aria-label="Abrir menu do perfil">
                            <i class="bi bi-person" aria-hidden="true"></i>
                        </button>

                        <!-- Seção do Dropdown -->
                        <div class="dropdown-menu dropdown-menu-end profile-dropdown">

                            <!-- Informações do usuário -->
                            <div class="profile-dropdown-header">
                                <div class="profile-avatar">
                                    <i class="bi bi-person"></i>
                                </div>

                                <div class="profile-details">
                                    <p class="profile-title">Conta do Usuário</p>
                                    <div class="profile-description">
                                        <small class="user-type">Usuário Padrão</small>
                                        <span>•</span>
                                        <small class="user-email">usuario@gmail.com</small>
                                    </div>
                                </div>

                            </div>

                            <hr class="dropdown-divider">

                            <!-- Opções -->
                            <button type="button" class="dropdown-item">
                                <i class="bi bi-gear"></i>
                                <span>Configurações</span>
                            </button>

                            <button type="button" class="dropdown-item">
                                <i class="bi bi-key"></i>
                                <span>Alterar senha</span>
                            </button>

                            <div class="dropdown-item theme-option">
                                <i class="bi bi-palette"></i>
                                <span>Tema do sistema</span>
                                <!-- Futuro botão de alternância -->
                            </div>

                            <hr class="dropdown-divider">

                            <!-- Sair -->
                            <button type="button" class="dropdown-item">
                                <i class="bi bi-box-arrow-right"></i>
                                <span>Sair</span>
                            </button>

                        </div>

                    </div>

                </div>


            </header>

            <main class="app-main" id="page-content">
                <!-- Conteúdo da página -->
            </main>

        </div>

    </section>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Funcionalidades do Dashboard -->
    <script src="js/dashboard.js"></script>

    <!-- Navegação principal -->
    <script src="js/app.js"></script>
    

</body>

</html>
