# Apache do container: atende na porta que o Render mandar (variável PORT).
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # Permite que o .htaccess do projeto funcione (rotas e header Authorization).
        AllowOverride All
        Require all granted
    </Directory>

    # Pastas e arquivos internos não podem ser abertos pelo navegador.
    RedirectMatch 404 ^/(app|database|tests|docker)(/|$)
    RedirectMatch 404 ^/\.(env|git|htaccess|dockerignore|gitignore)
    RedirectMatch 404 ^/Dockerfile$

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
